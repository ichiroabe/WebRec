<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="app.name">WebRec</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">●</span>
      <h1 data-i18n="app.name">WebRec</h1>
      <select id="langSelect" class="lang-select" data-i18n-title="common.language" aria-label="Language"></select>
    </header>

    <main>
      <div id="idleView" class="view">
        <p class="hint" id="idleHint" data-i18n="popup.idleHint"></p>
        <button id="startBtn" class="btn btn-primary" data-i18n="popup.start"></button>
      </div>

      <div id="recordingView" class="view hidden">
        <div class="status">
          <span class="rec-dot"></span>
          <span data-i18n="popup.recording"></span>
          <span id="stepCount"></span>
        </div>
        <p class="hint" id="startUrlHint"></p>
        <button id="stopBtn" class="btn btn-danger" data-i18n="popup.stop"></button>
      </div>

      <div id="doneView" class="view hidden">
        <p class="hint" id="doneMessage"></p>
        <button id="openManagerFromDone" class="btn btn-primary" data-i18n="popup.openManager"></button>
      </div>

      <p id="errorMsg" class="error hidden"></p>
    </main>

    <footer>
      <button id="openManagerBtn" class="link-btn" data-i18n="popup.openManagerLink"></button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
